{% extends 'base.html' %}

{% block content %}

<div class="exercise-header-row">

    <h1 class="section-heading">Traduisez :</h1>

    {% if phrase %}
        <p class="phrase">{{ phrase }}</p>
    {% endif %}
</div>

<div class="center-column">
    {% if phrase %}
        <form method="POST" class="form-wrapper">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input
            id="prompt-ae"
            placeholder="Écrivez votre réponse ici :"

            type="text"
            name="answer"
            required
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off">

            <input type="hidden" name="phrase" value="{{ phrase }}">
            <button type="submit" class="btn-IA-trad">Valider</button>
        </form>

    {% else %}
        <p>❌ Aucune phrase disponible</p>
    {% endif %}

</div>

{% endblock %}
