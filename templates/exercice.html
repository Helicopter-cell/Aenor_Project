{% extends 'base.html' %}

{% block content %}
<section class="exercise-page" aria-labelledby="exercise-title">
    <header class="page-intro exercise-intro">
        <p class="page-eyebrow">La salle d'entraînement</p>
        <h1 class="section-heading" id="exercise-title">À vous de traduire</h1>
        <p>Un instant pour retrouver les mots justes.</p>
    </header>

    {% if phrase %}
        <section class="exercise-prompt" aria-labelledby="exercise-prompt-title">
            <p class="page-eyebrow" id="exercise-prompt-title">Votre phrase</p>
            <p class="exercise-phrase">{{ phrase }}</p>
        </section>

        <form method="POST" class="form-wrapper exercise-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="sr-only" for="prompt-ae">Votre traduction en Aënor</label>
            <input
                id="prompt-ae"
                placeholder="Écrivez votre réponse en Aënor..."
                type="text"
                name="answer"
                required
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off">
            <input type="hidden" name="phrase" value="{{ phrase }}">
            <button type="submit" class="btn-IA-trad">Valider ma réponse <span aria-hidden="true">→</span></button>
        </form>
    {% else %}
        <p class="exercise-unavailable" role="status">Aucune phrase n'est disponible pour le moment.</p>
    {% endif %}
</section>
{% endblock %}
