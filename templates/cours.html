{% extends 'base.html' %}

{% block content %}
<div class="lexique-page">
    <h1>Lexiques</h1>
    <p class="lexique-introduction">Chaque entrée présente la traduction française, l'écriture Aënor, sa translittération occidentale et sa prononciation.</p>

    <form class="lexique-search" role="search" onsubmit="return false;">
        <label class="lexique-search-label" for="lexique-search">Rechercher dans le lexique</label>
        <div class="lexique-search-control">
            <input id="lexique-search" name="lexique-search" type="search" autocomplete="off" placeholder="Rechercher un mot en français, Aënor, occidental ou phonétique...">
        </div>
    </form>

    <p id="lexique-no-results" class="lexique-no-results" role="status" hidden>Aucun mot trouvé dans le lexique pour cette recherche.</p>

    {{ cours | render_cours_value }}
</div>

<script src="{{ url_for('static', filename='js/lexique-search.js') }}"></script>
{% endblock %}
