<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aënor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename=static_path('|staticPATH|main')) }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/favicon-512.png') }}">
</head>
<body>

<img src="{{ url_for('static', filename=static_path('|imagePATH|Wood-IA')) }}" class="background-image">

<img src="{{ url_for('static', filename=static_path('|imagePATH|Corner')) }}" class="corner-right">
<img src="{{ url_for('static', filename=static_path('|imagePATH|Corner-Copie')) }}" class="corner-left">

<script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/hatch.js"></script>

<!-- 🌿 NAVBAR -->
<button class="mobile-menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false">
    <span aria-hidden="true">☰</span>
    <span class="sr-only">Ouvrir le menu</span>
</button>

<nav class="navbar" id="main-navigation">
    <a href="/" class="nav-element">Accueil</a>
    <a href="/cours" class="nav-element">Lexique</a>
    <a href="/exercice" class="nav-element">Exercices</a>
    <a href="{{ url_for('historique') }}" class="nav-element">Historique</a>
    <a href="/grammaire_3" class="nav-element">Grammaire</a>
    <a href="/ia-trad" class="nav-element">Traducteur</a>
    <a href="/scenario" class="nav-element">Scénario</a>
    <a href="{{ url_for('commentaires') }}" class="nav-element">Vos retours</a>
    <a href="/admin" class="nav-element">Admin</a>
</nav>

<!-- 🌿 CONTENU -->
<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
    document.querySelector('.mobile-menu-toggle')?.addEventListener('click', function () {
        const isOpen = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!isOpen));
        this.classList.toggle('open', !isOpen);
        document.querySelector('#main-navigation').classList.toggle('open', !isOpen);
    });
</script>

</body>
<footer>Robin   LALUNG-BONNAIRE</footer>
</html>
