<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Aënor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename=static_path('|staticPATH|main'), v=static_version('|staticPATH|main')) }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/favicon-512.png') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js" defer></script>
    <script src="{{ url_for('static', filename='js/aenor-motion.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/ambient-curves.js') }}" defer data-swup-ignore-script></script>
    <script src="https://unpkg.com/swup@4.10.0" defer></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@2.1.0" defer></script>
    <script src="{{ url_for('static', filename='js/swup-navigation.js') }}" defer data-swup-ignore-script></script>
</head>
<body>

{% include 'partials/ambient-grain.html' %}

<svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden">
    <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="1" seed="7" result="glassNoise"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="glassNoise" scale="4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
</svg>

<svg class="ambient-curves" aria-hidden="true" focusable="false">
    <path class="ambient-curve ambient-curve--copper"></path>
    <path class="ambient-curve ambient-curve--leaf"></path>
    <path class="ambient-curve ambient-curve--copper"></path>
    <path class="ambient-curve ambient-curve--snow"></path>
    <path class="ambient-curve ambient-curve--leaf"></path>
    <g class="ambient-glyph ambient-glyph--copper"><path d="M3 25 14 4l11 21M8 18h12"></path><circle cx="14" cy="4" r="2"></circle></g>
    <g class="ambient-glyph ambient-glyph--leaf"><path d="M5 6h18M14 6v22M7 22c4-5 10-5 14 0"></path><circle cx="14" cy="14" r="2"></circle></g>
    <g class="ambient-glyph ambient-glyph--copper"><path d="M5 16c5-13 15-13 20 0-5 13-15 13-20 0ZM14 10v12"></path></g>
    <g class="ambient-glyph ambient-glyph--leaf"><path d="M6 5v22M22 5v22M6 13h16M10 5c0 6 2 9 4 9s4 3 4 8"></path></g>
    <g class="ambient-glyph ambient-glyph--copper"><path d="M4 8h20M14 8c0 4-4 5-4 9s4 4 4 9M6 26h16"></path><circle cx="14" cy="17" r="2"></circle></g>
    <g class="ambient-glyph ambient-glyph--leaf"><path d="M7 5c10 2 12 6 12 12 0 4 2 7 6 8M6 25h12M12 9v16"></path></g>
    <g class="ambient-glyph ambient-glyph--copper"><path d="M5 14h18M14 4v20M8 8l12 12M20 8 8 20"></path><circle cx="14" cy="14" r="3"></circle></g>
    <g class="ambient-glyph ambient-glyph--leaf"><path d="M5 7c6 0 9 3 9 7s3 7 9 7M5 25h18M14 4v24"></path></g>
</svg>
<div class="ambient-ink-dust" aria-hidden="true"></div>

<div id="swup" class="transition-room" data-csrf-token="{{ csrf_token() }}">
<script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/hatch.js" data-swup-ignore-script></script>

<header class="site-header">
    <a class="site-brand" href="/" aria-label="Aënor — accueil">
        <span class="site-brand-mark" aria-hidden="true">A</span>
        <span class="site-brand-name">Aënor</span>
    </a>
    <button class="mobile-menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false">
        <span aria-hidden="true">☰</span>
        <span class="sr-only">Ouvrir le menu</span>
    </button>

    <nav class="navbar" id="main-navigation" aria-label="Navigation principale">
        <a href="/" class="nav-element" {% if request.path == '/' %}aria-current="page"{% endif %}>Accueil</a>
        <a href="/cours" class="nav-element" {% if request.path == '/cours' %}aria-current="page"{% endif %}>Lexique</a>
        <a href="/minijeu" class="nav-element" {% if request.path == '/minijeu' %}aria-current="page"{% endif %}>Divination</a>
        <a href="/exercice" class="nav-element" {% if request.path == '/exercice' %}aria-current="page"{% endif %}>Exercices</a>
        <a href="{{ url_for('main.historique') }}" class="nav-element" {% if request.path == url_for('main.historique') %}aria-current="page"{% endif %}>Historique</a>
        <a href="/grammaire_3" class="nav-element" {% if request.path == '/grammaire_3' %}aria-current="page"{% endif %}>Grammaire</a>
        <a href="/ia-trad" class="nav-element" {% if request.path == '/ia-trad' %}aria-current="page"{% endif %}>Traducteur</a>
        <a href="/scenario" class="nav-element" {% if request.path == '/scenario' %}aria-current="page"{% endif %}>Scénario</a>
        <a href="{{ url_for('main.commentaires') }}" class="nav-element" {% if request.path == url_for('main.commentaires') %}aria-current="page"{% endif %}>Vos retours</a>
        <a href="/obj_project" class="nav-element" {% if request.path == '/obj_project' %}aria-current="page"{% endif %}>Objectifs du projet</a>
        <a href="/admin" class="nav-element" data-no-swup {% if request.path == '/admin' %}aria-current="page"{% endif %}>Admin</a>
    </nav>
</header>

<!-- CONTENU -->
<main id="main-content" class="container transition-content" tabindex="-1">
    {% block content %}{% endblock %}
</main>

<footer>Robin LALUNG-BONNAIRE</footer>
</div>

</body>

</html>
