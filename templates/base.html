<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Aënor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename=static_path('|staticPATH|main'), v=static_version('|staticPATH|main')) }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/favicon-512.png') }}">
    <script src="{{ url_for('static', filename='js/speech.js') }}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="{{ url_for('static', filename='js/aenor-motion.js') }}" defer></script>
</head>
<body>

<script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/hatch.js"></script> <!-- Je sais même pas si on en a encore besoin en fait -->

<header class="site-header">
    <a class="site-brand" href="/" aria-label="Aënor — accueil">
        <span class="site-brand-mark" aria-hidden="true">A</span>
        <span class="site-brand-name">Aënor</span>
    </a>
    <button class="mobile-menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false">
        <span aria-hidden="true">☰</span>
        <span class="sr-only">Ouvrir le menu</span>
    </button>

    <nav class="navbar" id="main-navigation" aria-label="Navigation principale">
        <a href="/" class="nav-element" {% if request.path == '/' %}aria-current="page"{% endif %}>Accueil</a>
        <a href="/cours" class="nav-element" {% if request.path == '/cours' %}aria-current="page"{% endif %}>Lexique</a>
        <a href="/exercice" class="nav-element" {% if request.path == '/exercice' %}aria-current="page"{% endif %}>Exercices</a>
        <a href="{{ url_for('main.historique') }}" class="nav-element" {% if request.path == url_for('main.historique') %}aria-current="page"{% endif %}>Historique</a>
        <a href="/grammaire_3" class="nav-element" {% if request.path == '/grammaire_3' %}aria-current="page"{% endif %}>Grammaire</a>
        <a href="/ia-trad" class="nav-element" {% if request.path == '/ia-trad' %}aria-current="page"{% endif %}>Traducteur</a>
        <a href="/scenario" class="nav-element" {% if request.path == '/scenario' %}aria-current="page"{% endif %}>Scénario</a>
        <a href="{{ url_for('main.commentaires') }}" class="nav-element" {% if request.path == url_for('main.commentaires') %}aria-current="page"{% endif %}>Vos retours</a>
        <a href="/obj_project" class="nav-element" {% if request.path == '/obj_project' %}aria-current="page"{% endif %}>Objectifs du projet</a>
        <a href="/admin" class="nav-element" {% if request.path == '/admin' %}aria-current="page"{% endif %}>Admin</a>
    </nav>
</header>

<!-- CONTENU -->
<main class="container">
    {% block content %}{% endblock %}
</main>

<script>
    document.querySelector('.mobile-menu-toggle')?.addEventListener('click', function () {
        const isOpen = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!isOpen));
        this.classList.toggle('open', !isOpen);
        document.querySelector('#main-navigation').classList.toggle('open', !isOpen);
    });
</script>

<footer>Robin LALUNG-BONNAIRE</footer>

</body>

</html>
