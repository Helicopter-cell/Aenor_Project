{% extends 'base.html' %}

{% block content %}

<section class="result-page" aria-labelledby="result-score">
    <h1 class="result" id="result-score">{{ note }} / 10</h1>

    <p class="phrase">{{ phrase }}</p>

    <p>Ta réponse :</p>
    {% if note >= 8 %}
        <p class="bonne-réponse">{{ user }}</p>
    {% elif note >= 5 %}
        <p class="moyenne-réponse">{{ user }}</p>
    {% else %}
        <p class="mauvaise-réponse">{{ user }}</p>
    {% endif %}

    <p>Commentaire du professeur :</p>
    <div class="commentaire">{{ commentaire }}</div>

    <a class="btn btn-primary" href="/exercice">Recommencer</a>
</section>

{% endblock %}
